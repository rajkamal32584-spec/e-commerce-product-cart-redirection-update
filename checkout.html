<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Checkout - Modern E-commerce</title>
    <link rel="stylesheet" href="styles.css">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
</head>
<body class="font-inter bg-gray-100">
    <header class="bg-white shadow">
        <nav class="container mx-auto px-6 py-4 flex justify-between items-center">
            <a href="index.html" class="text-xl font-semibold text-gray-800">Modern E-commerce</a>
            <div class="flex space-x-4">
                <a href="index.html" class="text-gray-700 hover:text-gray-900">Home</a>
                <a href="about.html" class="text-gray-700 hover:text-gray-900">About</a>
                <a href="cart.html" class="text-gray-700 hover:text-gray-900">Cart</a>
                <a href="checkout.html" class="text-gray-700 hover:text-gray-900">Checkout</a>
            </div>
        </nav>
    </header>
    <main class="container mx-auto px-6 py-8">
        <h1 class="text-3xl font-bold text-gray-800 mb-8">Checkout</h1>
        <form class="bg-white rounded-lg shadow p-6">
            <div class="mb-4">
                <label class="block text-gray-700">Full Name</label>
                <input type="text" class="mt-1 block w-full px-4 py-2 border rounded-lg">
            </div>
            <div class="mb-4">
                <label class="block text-gray-700">Address</label>
                <input type="text" class="mt-1 block w-full px-4 py-2 border rounded-lg">
            </div>
            <div class="mb-4">
                <label class="block text-gray-700">Payment Method</label>
                <select class="mt-1 block w-full px-4 py-2 border rounded-lg">
                    <option>Credit Card</option>
                    <option>Debit Card</option>
                    <option>Net Banking</option>
                </select>
            </div>
            <button type="button" onclick="window.location.href='order-confirmation.html'" class="bg-blue-600 text-white px-4 py-2 rounded-lg hover:bg-blue-700">Proceed to Payment</button>
        </form>
    </main>
    <script src="app.js"></script>

<script>document.addEventListener("DOMContentLoaded", function() { if (window.lucide) { window.lucide.createIcons(); } });</script>
</body>
</html>
